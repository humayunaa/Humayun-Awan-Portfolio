<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Review Classifier - Prediction</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px 50px; /* Leave space on left and right */
        }

        h1 {
            color: #225da0;
        }

        p {
            color: #000000;
            font-size: 16px;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff0000;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #d00000;
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Film Review Prediction</h1>
        <p><strong>Review:</strong> <em>{{ result.text }}</em></p>
        <p><strong>Classifier Prediction:</strong> {{ result.prediction }}</p>
        <a href="/">New Review</a>
        <footer>
            <p>&copy; Humayun Awan</p>
        </footer>
    </div>
</body>
</html>
